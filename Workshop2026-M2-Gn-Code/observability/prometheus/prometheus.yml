global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8000"]
        labels: {service: payment-api}
