; Firmware ESP8266 — LED bicolore d'état du parcours d'authentification back-office.
; Ouvrir ce dossier dans CLion (plugin PlatformIO) ou VS Code + PlatformIO.
;
; Carte par défaut : NodeMCU v2. Pour un Wemos/LOLIN D1 mini, remplacez
; board = nodemcuv2  par  board = d1_mini

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
