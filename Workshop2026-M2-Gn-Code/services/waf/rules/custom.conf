# Règles ModSecurity additionnelles — contexte paiement (optionnelles, cf. README).

# Bloque les montants manifestement hors bornes envoyés à /api/payments
SecRule REQUEST_URI "@beginsWith /api/payments" \
    "id:100001,phase:2,pass,nolog,chain"
    SecRule ARGS:amount_cents "@gt 10000000" \
        "t:none,deny,status:400,log,msg:'Montant hors bornes'"

# Journalise toute détection SQLi sur le paramètre de référence (scénario secondaire)
SecRule ARGS:ref "@detectSQLi" \
    "id:100002,phase:2,deny,status:403,log,msg:'Tentative injection SQL sur ref',tag:'paiement'"
