# Surcharges ModSecurity (chargé avant les règles OWASP CRS).
#
# Les endpoints 2FA du back-office reçoivent des IMAGES base64 depuis la caméra.
# Ce contenu binaire encodé déclenche de nombreux faux positifs CRS (motifs qui
# ressemblent à SQLi/XSS/RCE dans le base64 aléatoire). On désactive donc
# l'inspection ModSecurity pour ces deux chemins précis.
#
# Compromis de sécurité assumé : ces endpoints ne sont pas inspectés par le WAF,
# mais ils restent protégés par l'application elle-même (jeton JWT admin requis
# pour l'enrôlement, service face-auth qui valide l'image) et ne traitent que des
# images, pas des entrées texte exploitables.

SecRule REQUEST_URI "@beginsWith /auth/backoffice/enroll" \
    "id:1100,phase:1,pass,nolog,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /auth/backoffice/face" \
    "id:1101,phase:1,pass,nolog,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /auth/register" \
    "id:1102,phase:1,pass,nolog,ctl:ruleEngine=Off"
